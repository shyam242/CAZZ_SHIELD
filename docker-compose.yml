version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: cazz-shield-postgres
    environment:
      POSTGRES_USER: cazz_user
      POSTGRES_PASSWORD: cazz_password
      POSTGRES_DB: cazz_shield
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cazz_user -d cazz_shield"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cazz-shield-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cazz-shield-backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://cazz_user:cazz_password@postgres:5432/cazz_shield
      - REDIS_URL=redis://redis:6379/0
      - DEBUG=False
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cazz-shield-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
